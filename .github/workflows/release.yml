name: Release

on:
  push:
    tags:
      - 'v*'
      - 'RELEASE.*'

permissions:
  contents: write   # create GitHub release
  packages: write   # push Helm chart to GHCR

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/storvia
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fork
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/storvia:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0   # report only; set to 1 to block releases on findings

  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          check-latest: true

      - name: Build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          go build -tags kqueue -trimpath \
            -ldflags "-s -w \
              -X github.com/ergin84/storvia/cmd.Version=${{ github.ref_name }} \
              -X github.com/ergin84/storvia/cmd.ReleaseTag=${{ github.ref_name }} \
              -X github.com/ergin84/storvia/cmd.CommitID=${GITHUB_SHA} \
              -X github.com/ergin84/storvia/cmd.ShortCommitID=${SHORT_SHA}" \
            -o storvia-${{ matrix.os }}-${{ matrix.arch }}${EXT} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: storvia-${{ matrix.os }}-${{ matrix.arch }}
          path: storvia-${{ matrix.os }}-${{ matrix.arch }}*

  helm:
    name: Publish Helm chart to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          TAG="${{ github.ref_name }}"
          APP_VERSION="$TAG"
          # Helm requires semver; convert RELEASE.YYYY-MM-DDTHH-MM-SSZ → YYYY.MMDD.HHMMSS
          if [[ "$TAG" == RELEASE.* ]]; then
            SEMVER=$(echo "$TAG" | sed 's/RELEASE\.\([0-9]\{4\}\)-\([0-9]\{2\}\)-\([0-9]\{2\}\)T\([0-9]\{2\}\)-\([0-9]\{2\}\)-\([0-9]\{2\}\)Z/\1.\2\3.\4\5\6/')
          else
            SEMVER="${TAG#v}"
          fi
          helm package helm/storvia --version "$SEMVER" --app-version "$APP_VERSION"
          helm push "storvia-${SEMVER}.tgz" oci://ghcr.io/${{ github.repository_owner }}

  github-release:
    name: Create GitHub release
    needs: [docker, binaries, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: storvia-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum storvia-* > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/storvia-*
            dist/checksums.sha256
          body: |
            ## Docker image

            ```sh
            docker pull erginmehmeti/storvia:${{ github.ref_name }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.
            See [Docker Hub](https://hub.docker.com/r/erginmehmeti/storvia) for all available tags.

            ## Helm chart

            ```sh
            helm install storvia oci://ghcr.io/ergin84/storvia --version ${{ github.ref_name }}
            ```

            ## Install from source

            ```sh
            go install github.com/ergin84/storvia@${{ github.ref_name }}
            ```

            ## Verify checksums

            ```sh
            sha256sum -c checksums.sha256
            ```
