{{- if and (.Values.networkPolicy.enabled) (eq .Values.networkPolicy.flavor "kubernetes") }}
kind: NetworkPolicy
apiVersion: {{ template "storvia.networkPolicy.apiVersion" . }}
metadata:
  name: {{ template "storvia.fullname" . }}
  labels:
    app: {{ template "storvia.name" . }}
    chart: {{ template "storvia.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: {{ template "storvia.name" . }}
      release: {{ .Release.Name }}
  ingress:
    - ports:
        - port: {{ .Values.minioAPIPort }}
          protocol: TCP
        - port: {{ .Values.minioConsolePort }}
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector:
            matchLabels:
              {{ template "storvia.name" . }}-client: "true"
      {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - ports:
        {{ .Values.networkPolicy.egress.ports | toJson }}
      {{- with .Values.networkPolicy.egress.to }}
      to:
        {{- toYaml . | nindent 12 }}
      {{- end }}
  {{- end }}
---
kind: NetworkPolicy
apiVersion: {{ template "storvia.networkPolicy.apiVersion" . }}
metadata:
  name: {{ template "storvia.fullname" . }}-post-job
  labels:
    app: {{ template "storvia.name" . }}-post-job
    chart: {{ template "storvia.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: {{ template "storvia.name" . }}-job
      release: {{ .Release.Name }}
  egress:
    - ports:
        - port: {{ .Values.minioAPIPort }}
          protocol: TCP
        - port: {{ .Values.minioConsolePort }}
          protocol: TCP
    {{- if .Values.networkPolicy.egress.enabled }}
    - ports:
        {{ .Values.networkPolicy.egress.ports | toJson }}
      {{- with .Values.networkPolicy.egress.to }}
      to:
        {{- toYaml . | nindent 12 }}
      {{- end }}
    {{- end }}
{{- end }}
